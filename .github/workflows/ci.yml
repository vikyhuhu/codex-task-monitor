name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate application and local data reader
        run: ./scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CodexTaskMonitor-macOS
          path: dist/CodexTaskMonitor-macOS.zip
